# Builds the Windows installer and attaches it to a GitHub release.
#
#   push a tag (v0.2.1)  ->  the installer is built and added to that release
#   run it by hand       ->  same, for the tag you type in
#
# The macOS .dmg is still built on a Mac and uploaded by hand; this workflow
# only knows about Windows.

name: Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the installer to (for example v0.2.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build Cenno for Windows
    runs-on: windows-latest

    env:
      # Empty when no certificate is stored in the repository secrets. The
      # build then stays unsigned and Windows shows the SmartScreen warning.
      CENNO_CERT_PFX_BASE64: ${{ secrets.CENNO_CERT_PFX_BASE64 }}
      CENNO_CERT_PASSWORD: ${{ secrets.CENNO_CERT_PASSWORD }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # mediapipe 0.10.9 has no wheels for 3.12 and up.
          python-version: "3.11"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        # lands in C:\Program Files (x86)\Inno Setup 6\ISCC.exe, which is where
        # build_win.bat looks for it.

      - name: Set up signing
        if: ${{ env.CENNO_CERT_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          # signtool comes with the Windows SDK.
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory -ErrorAction SilentlyContinue |
                 Sort-Object Name -Descending | Select-Object -First 1
          if ($sdk) { "$($sdk.FullName)\x64" | Out-File -FilePath $env:GITHUB_PATH -Append }

          # Turn the base64 secret into a .pfx the build can use.
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cenno.pfx", [Convert]::FromBase64String($env:CENNO_CERT_PFX_BASE64))
          $pfx = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 "$env:RUNNER_TEMP\cenno.pfx", $env:CENNO_CERT_PASSWORD
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store "My", "CurrentUser"
          $store.Open("ReadWrite")
          $store.Add($pfx)
          $store.Close()

          # build_win.bat signs both binaries when it finds these.
          "CENNO_SIGN_PFX=$env:RUNNER_TEMP\cenno.pfx" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CENNO_SIGN_PWD=$env:CENNO_CERT_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Signing with $pfx.Subject"

      - name: Check that the tag and the VERSION file agree
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $bare = $tag.TrimStart('v')
          if ($bare -notlike "*$version*") {
            Write-Error "The tag says '$bare' but the VERSION file says '$version'. Bump VERSION, commit, then tag."
            exit 1
          }
          Write-Host "Building version $version for tag $tag"

      - name: Build the exe and the installer
        shell: cmd
        run: .\build_win.bat

      - name: Check the signature
        if: ${{ env.CENNO_CERT_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          & signtool verify /pa "dist/Cenno-$version-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "The signature does not verify" }

      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cenno-Windows-Setup
          path: dist/Cenno-*-Setup.exe
          if-no-files-found: error

      - name: Attach the installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = "dist/Cenno-$version-Setup.exe"
          if (-not (Test-Path $setup)) { throw "The installer is missing: $setup" }

          # A release that is not there yet becomes a draft, so it is never
          # published before the notes and the .dmg are in place.
          gh release view $env:TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --draft --title "Cenno $version" --notes "Cenno $version for macOS and Windows. Draft: add the .dmg and the release notes before publishing."
          }
          gh release upload $env:TAG $setup --clobber
          gh release view $env:TAG --json url --jq .url
